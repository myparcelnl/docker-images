name: 'Build php-xd images'

on:
  workflow_dispatch:

  # Weekly rebuild, so security fixes in the base image and the PHP packages reach our images.
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4', '8.3', '8.2', '8.1', '8.0', '7.4']
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/login-ghcr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/build-push
        with:
          registry: ghcr.io
          context: images/php-xd
          image: myparcelnl/php-xd
          suffix: ${{ matrix.php }}
          # A cached apt layer would keep the old packages, so the weekly rebuild starts from scratch.
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}

  notify-on-failure:
    needs:
      - build
    if: always() && contains(needs.*.result, 'failure')
    uses: myparcelnl/actions/.github/workflows/notify-on-failure.yml@v5
    secrets: inherit
