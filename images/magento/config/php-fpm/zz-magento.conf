; Loads after the official image's zz-docker.conf. php-fpm runs in the foreground as the container process.
[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
; The web container connects over the compose network
listen = 0.0.0.0:9000
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
; Keeps the container environment, for example SMTP_HOST for magento-sendmail
clear_env = no
php_admin_value[memory_limit] = 2G
access.log = /dev/null
