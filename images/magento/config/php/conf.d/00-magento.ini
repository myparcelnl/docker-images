; PHP settings for Magento, CLI and FPM. The FPM pool sets its own memory_limit.
memory_limit = -1
max_execution_time = 1800
max_input_vars = 10000
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = UTC
zlib.output_compression = Off
realpath_cache_size = 10M
realpath_cache_ttl = 7200
sendmail_path = /usr/local/bin/magento-sendmail

[opcache]
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 130986
opcache.save_comments = 1
; Keep timestamp checks on, so an edit in a mounted plugin is live in production mode
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

[pcov]
pcov.enabled = 0
